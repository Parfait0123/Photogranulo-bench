[project]
name = "photogranulo"
version = "0.1.0"
description = "Photogranulométrie : benchmark et modèle de prédiction de courbes granulométriques"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",       # paths.yaml et configurations
    "pandas>=2",       # tables, lecture des courbes
    "openpyxl>=3",     # fichier Excel des courbes
    "pillow>=10",      # en-têtes d'images (audit)
    "globus-sdk>=3",   # téléchargement FRDR
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photogranulo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
